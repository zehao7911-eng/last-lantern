<!doctype html><html><head><meta charset="utf-8"><title>Lantern model inspection</title><style>body{margin:0;background:#131820;color:white;font:14px Arial}#info{position:fixed;top:10px;left:10px;background:#111a;padding:12px;white-space:pre;z-index:3}button{position:fixed;bottom:10px;left:10px;z-index:4}</style></head><body><div id="info">Loading...</div><button onclick="location.reload()">Retry</button><script src="three.min.js"></script><script src="GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x243243);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,100),r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x556070,1.8));let l=new THREE.DirectionalLight(0xffddab,2);l.position.set(3,5,4);scene.add(l);scene.add(new THREE.GridHelper(4,20));scene.add(new THREE.AxesHelper(1.5));let group=new THREE.Group();scene.add(group);camera.position.set(1.7,1.4,2);camera.lookAt(.58,.2,0);let a=0,e=1.56,d=1.4,drag=false,last;document.addEventListener('pointerdown',x=>{drag=true;last=[x.clientX,x.clientY]});document.addEventListener('pointerup',()=>drag=false);document.addEventListener('pointermove',x=>{if(!drag)return;a+=(x.clientX-last[0])*.005;e=Math.max(-.5,Math.min(1.2,e+(x.clientY-last[1])*.005));last=[x.clientX,x.clientY]});document.addEventListener('wheel',x=>d=Math.max(.6,Math.min(6,d+x.deltaY*.002)));
(async()=>{let m=await fetch('model-manifest.json').then(x=>x.json()),parts=[];for(let i=0;i<m.parts.length;i++){parts.push(await fetch(m.parts[i]).then(x=>x.arrayBuffer()));document.getElementById('info').textContent=`Loaded ${i+1}/${m.parts.length} parts`;}let all=new Uint8Array(m.bytes),off=0;parts.forEach(p=>{all.set(new Uint8Array(p),off);off+=p.byteLength});new THREE.GLTFLoader().parse(all.buffer,'',g=>{group.add(g.scene);document.getElementById('info').textContent=g.scene.children.map((o,i)=>`${i}: ${o.name} pos=${o.position.toArray().map(v=>v.toFixed(3))} scale=${o.scale.toArray()}`).join('\n');console.log('SCENE',g.scene);},e=>document.getElementById('info').textContent='ERROR '+e);})();
function frame(){requestAnimationFrame(frame);camera.position.set(.58+Math.cos(a)*Math.cos(e)*d,.25+Math.sin(e)*d,Math.sin(a)*Math.cos(e)*d);camera.lookAt(.58,.25,0);r.render(scene,camera)}frame();
</script></body></html>
